      window.__walletKey = key;
      var html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    } catch (error) {
      try { localStorage.removeItem(STORE); } catch (ignored) {}
      button.disabled = false; button.textContent = 'Open';
      if (typed) { input.setAttribute('aria-invalid', 'true'); note.textContent = 'That passcode did not open the wallet.'; input.select(); }
    }
  }
  input.addEventListener('input', function () { input.removeAttribute('aria-invalid'); note.textContent = ''; });
  form.addEventListener('submit', function (event) { event.preventDefault(); unlock(input.value, true); });
  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (error) {}
  if (saved) unlock(saved, false); else input.focus();
</script>
</body>
</html>
