<script>
  var SALT = 'RbEA5F2maqjiDQBsOpssew==', ITERATIONS = 600000, STORE = 'paris-wallet-passcode';
  var form = document.getElementById('gate'), input = document.getElementById('code'), note = document.getElementById('note'), button = form.querySelector('button');
  function bytes(text) { return Uint8Array.from(atob(text), function (c) { return c.charCodeAt(0); }); }
  async function unlock(passcode, typed) {
    var clean = passcode.toLowerCase().replace(/[^a-z0-9]/g, '');
    button.disabled = true; button.textContent = 'Opening…'; note.textContent = '';
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clean), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITERATIONS, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var sealed = bytes(document.getElementById('sealed').textContent.trim());
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: sealed.slice(0, 12) }, key, sealed.slice(12));
      try { localStorage.setItem(STORE, clean); } catch (error) {}
      window.__walletKey = key;
      var html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    } catch (error) {
      try { localStorage.removeItem(STORE); } catch (ignored) {}
      button.disabled = false; button.textContent = 'Open';
      if (typed) { note.textContent = 'That passcode did not open the wallet.'; input.select(); }
    }
  }
  form.addEventListener('submit', function (event) { event.preventDefault(); unlock(input.value, true); });
  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (error) {}
  if (saved) unlock(saved, false); else input.focus();
</script>
